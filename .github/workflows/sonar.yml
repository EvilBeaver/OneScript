name: QA

on:
  push:  
  pull_request:
  
jobs:
  sonar:
    name: SonarQube
    runs-on: windows-latest
    if: github.repository == 'EvilBeaver/OneScript'
    env:
      # У PR из форка нет секретов: здесь только сборка с анализаторами, а результаты на сервер отправляет sonar-fork.yml
      FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.event.repository.full_name }}
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v6.0.1
        with:
          java-version: 17
          distribution: temurin
      - uses: actions/checkout@v7
        with:
          # PR из форка собираем по головному коммиту: его же sonar-fork.yml берет как исходники
          ref: ${{ env.FORK_PR == 'true' && github.event.pull_request.head.sha || '' }}
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
      - name: Cache SonarQube packages
        uses: actions/cache@v6
        with:
          path: ~\sonar\cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      - name: Cache SonarQube scanner
        id: cache-sonar-scanner
        uses: actions/cache@v6
        with:
          path: .\.sonar\scanner
          key: ${{ runner.os }}-sonar-scanner
          restore-keys: ${{ runner.os }}-sonar-scanner
      - name: Install SonarQube scanner
        if: steps.cache-sonar-scanner.outputs.cache-hit != 'true'
        shell: powershell
        run: |
          New-Item -Path .\.sonar\scanner -ItemType Directory
          dotnet tool update dotnet-sonarscanner --tool-path .\.sonar\scanner
      - name: Install coverage tool
        shell: powershell
        run: |
          dotnet tool install --global dotnet-coverage
      - name: Compute branch name
        uses: nelonoel/branch-name@v1.0.1
      - name: Prepare analysis (branch)
        if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        shell: powershell
        run: |
          .\.sonar\scanner\dotnet-sonarscanner begin /k:"OneScript" /d:sonar.cs.vscoveragexml.reportsPaths=coverage.xml /d:sonar.branch.name=${{ env.BRANCH_NAME }} /d:sonar.login="${{ secrets.SONAR_TOKEN }}" /d:sonar.host.url="https://sonar.openbsl.ru" 
      - name: Prepare analysis (pull-request)
        if: github.event_name == 'pull_request' && env.FORK_PR != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        shell: powershell
        run: |
          .\.sonar\scanner\dotnet-sonarscanner begin /k:"OneScript" /d:sonar.cs.vscoveragexml.reportsPaths=coverage.xml /d:sonar.pullrequest.key=${{ github.event.pull_request.number }} /d:sonar.pullrequest.branch=${{ github.event.pull_request.head.ref }} /d:sonar.pullrequest.base=${{ github.event.pull_request.base.ref }} /d:sonar.scm.revision=${{ github.event.pull_request.head.sha }} /d:sonar.login="${{ secrets.SONAR_TOKEN }}" /d:sonar.host.url="https://sonar.openbsl.ru"        
      - name: Prepare analysis (fork pull-request)
        if: env.FORK_PR == 'true'
        shell: powershell
        run: |
          .\.sonar\scanner\dotnet-sonarscanner begin /k:"OneScript" /d:sonar.cs.vscoveragexml.reportsPaths=coverage.xml /d:sonar.scanner.skipJreProvisioning=true /d:sonar.host.url="https://sonar.openbsl.ru"
      - name: Russian locale
        shell: pwsh
        run: Set-Culture ru-RU
      - name: Build and test
        env:
          OSCRIPT_CONFIG: systemlanguage=ru
        shell: powershell
        run: |
          dotnet publish src/oscript/oscript.csproj
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          # Упавшие тесты ловит основная сборка, здесь от них нужно только покрытие
          dotnet-coverage collect "dotnet msbuild Build.csproj -t:UnitTests" -f xml -o "coverage.xml"
          exit 0
      - name: Analyze
        if: env.FORK_PR != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Needed to get PR information, if any
        shell: powershell
        run: |
          .\.sonar\scanner\dotnet-sonarscanner end /d:sonar.login="${{ secrets.SONAR_TOKEN }}"
      # Номер нужен sonar-fork.yml: из одной ветки форка может быть несколько PR в разные ветки
      - name: Save pull request number (fork pull-request)
        if: env.FORK_PR == 'true'
        shell: pwsh
        run: Set-Content pr-number.txt ${{ github.event.pull_request.number }}
      - name: Save analysis (fork pull-request)
        if: env.FORK_PR == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: sonar-analysis
          path: |
            .sonarqube/out
            .sonarqube/conf/*/FilesToAnalyze.txt
            coverage.xml
            pr-number.txt
          include-hidden-files: true
          retention-days: 1
